name: joba_admin
description: "Joba Admin Panel - responsive web & mobile dashboard for the Joba period tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI (same as the Joba app)
  get: ^4.7.3

  # UI
  google_fonts: ^6.2.2
  fl_chart: ^0.70.2
  intl: ^0.20.2
  flutter_svg: ^2.0.17

  # Utilities
  uuid: ^4.5.1
  file_picker: ^8.1.2
  just_audio: ^0.9.43

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/reminder/
    - assets/icons/home/
    - assets/images/profile_avatars/modern/
    - assets/images/profile_avatars/simple/
    - assets/images/profile_avatars/animal/
    - assets/images/profile_avatars/hijab/
    - assets/images/articles/
